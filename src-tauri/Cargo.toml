[package]
name = "portfolio-manager"
version = "2.0.0"
description = "Portfolio Manager desktop shell (Tauri)"
authors = ["Matt Briggs"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "portfolio_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# NOTE: The current Tauri 2.x transitive tree (toml 1.x, serde_spanned 1.x,
# zeroize 1.9) requires Rust >= 1.85 (edition2024). Build with a Rust toolchain
# >= 1.85 (`rustup update`). The Rust sources and unit tests compile cleanly on
# such a toolchain; see docs/development/rust-toolchain.md.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
rand = "0.8"
secrecy = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# Enabled by tauri when building the desktop app; production builds set this to
# disable devtools.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
