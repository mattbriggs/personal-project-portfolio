name: Frontend

on:
  push:
    branches: ["main", "mdb_*"]
    paths: ["frontend/**", "package.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "package.json", ".github/workflows/frontend.yml"]

jobs:
  test:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci || npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit / component tests
        run: npm run test

      - name: Build renderer
        run: npm run build

      - name: No direct renderer HTTP
        run: python3 scripts/verify_no_renderer_http.py
