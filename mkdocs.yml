site_name: Portfolio Manager
site_description: Personal Portfolio Work Orchestrator — documentation
site_author: Matt Briggs

docs_dir: site/src
site_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

hooks:
  - tools/prepare_guide.py

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Mermaid.js loaded via CDN so diagrams render inline without the mermaid2 plugin.
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Guide: guide/index.md
  - Architecture:
      - Overview: architecture.md
      - Data Model: data-model.md
      - Design Patterns: design-patterns.md
      - Decision Records:
          - Index: architecture/decisions/README.md
          - 001 Tauri-mediated sidecar: architecture/decisions/adr-001-tauri-mediated-sidecar.md
          - 002 Preserve Python domain: architecture/decisions/adr-002-preserve-domain.md
          - 003 Query and cache library: architecture/decisions/adr-003-query-cache.md
          - 004 UI and accessibility: architecture/decisions/adr-004-ui-accessibility.md
          - 005 OpenAPI to TypeScript: architecture/decisions/adr-005-openapi-typescript.md
          - 006 Startup credentials: architecture/decisions/adr-006-startup-credentials.md
          - 007 Readiness endpoint auth: architecture/decisions/adr-007-readiness-auth.md
          - 008 Blank weekly review: architecture/decisions/adr-008-blank-review.md
          - 009 Zero-project portfolio score: architecture/decisions/adr-009-zero-project-score.md
          - 010 macOS sidecar architecture: architecture/decisions/adr-010-macos-arch.md
          - 011 Markdown and Mermaid: architecture/decisions/adr-011-markdown-rendering.md
  - Development:
      - Development Guide: development.md
      - Rust Toolchain: development/rust-toolchain.md
  - Testing: testing.md
  - Requirements:
      - Traceability Matrix: requirements/traceability.md
  - Release:
      - Completion Report: release/completion-report.md
      - Docs Quality Review: release/docs-quality-review.md
